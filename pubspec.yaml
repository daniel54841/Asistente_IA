  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: 4.6.5
  lottie: 2.3.1
  firebase_core: 2.25.4
  firebase_auth: 4.17.4
  flutter_animation_progress_bar: 2.3.1
  sqflite: 2.3.2
  flutter_riverpod: 2.4.1
  logger: 2.1.0
  flutter_device_type: 0.4.0

dev_dependencies:


